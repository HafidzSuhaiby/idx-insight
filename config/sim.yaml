# Aturan mesin simulasi IDX Insight (Bagian 8 PRD). Semua nilai dapat diubah di sini.
params_version: v1.0.0

accounts:
  A:
    initial_cash: 1000000        # meniru kondisi nyata
    max_positions: 2
    max_weight_per_stock: 0.50
    label: "Akun A (Rp1.000.000)"
  B:
    initial_cash: 20000000       # menilai kualitas sinyal
    max_positions: 8
    max_weight_per_stock: 0.15
    label: "Akun B (Rp20.000.000)"

risk_per_trade: 0.02        # 2% ekuitas per transaksi (jarak stop menentukan ukuran posisi)
lot_size: 100               # 1 lot = 100 lembar, pembelian dibulatkan ke bawah ke lot
slippage: 0.001             # 0,1% saat beli
fee:
  buy: 0.0015               # 0,15%
  sell: 0.0025              # 0,25% termasuk pajak final
settlement_days: 2          # dana hasil jual tersedia T+2 (hari bursa)
max_hold_days: 20           # hari bursa

# Fraksi harga IDX: [batas_bawah, batas_atas, fraksi]; batas_atas null = tak terbatas
price_fraction:
  - [0, 200, 1]
  - [200, 500, 2]
  - [500, 2000, 5]
  - [2000, 5000, 10]
  - [5000, null, 25]

ara_arb:
  enabled: true
  ara: 0.20                 # auto reject atas ~20% (papan utama, harga 200-5000); VERIFIKASI batas terbaru IDX
  arb: 0.15                 # auto reject bawah
  note: "Order yang mustahil terisi karena batas dicatat 'tidak terisi', bukan dipaksa."

reset:                      # reset akun hanya lewat config + commit (PRD FR-4)
  mode: keep                # keep | reset_to_date
  reset_to_date: null       # mis. "2026-11-17" bila mode=reset_to_date

# Jendela replay historis: mesin simulasi yang sama dijalankan mundur dari tanggal ini.
# Tujuannya memberi konteks awal (in-sample) sambil data real-time terkumpul; bukan backtest
# walk-forward M7 dan TIDAK dipakai untuk mengklaim kelayakan. null = mulai dari hari ini.
replay_from: "2025-11-03"
replay_note: "Replay memakai harga nyata dan indikator sampai tanggal itu, tanpa faktor fundamental (hindari look-ahead)."

# Kriteria kelayakan (PRD Bagian 9) — usulan, dapat diubah.
scorecard:
  min_days: 60
  min_trades: 30
  min_profit_factor: 1.3
  max_drawdown: 15
  use_live_only_for_verdict: true   # status Layak hanya boleh dari transaksi real-time, bukan replay
