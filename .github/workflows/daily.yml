name: Harian — pipeline & deploy

# 10:30 UTC = 17:30 WIB, Senin–Jumat (setelah penutupan bursa).
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      no_replay:
        description: 'Lewati replay historis (lebih cepat)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: harian
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Jalankan pipeline penuh
        # Uji jaringan terpisah (tests/test_pipeline.py) sengaja tidak dipakai di sini:
        # ia mengunduh ulang 3 saham dan gagal karena throttle Yahoo dari IP runner,
        # padahal pipeline penuh sudah memvalidasi seluruh univ. Verifikasi dilakukan
        # pada keluaran (langkah berikutnya), bukan pada panggilan jaringan kedua.
        run: |
          python -m pipeline.run ${{ inputs.no_replay && '--no-replay' || '' }} || {
            echo "percobaan 1 gagal, mengulang setelah 90 detik"; sleep 90
            python -m pipeline.run ${{ inputs.no_replay && '--no-replay' || '' }}
          }

      - name: Verifikasi keluaran pipeline
        run: python -c "import json,sys; m=json.load(open('web/public/data/meta.json')); print(m['as_of'], m['status'], f\"{m['universe_ok']}/{m['universe_total']} saham\", f\"error={m['n_errors']}\"); sys.exit(0 if m['status']=='ok' and m['universe_ok']>=40 else 1)"

      - name: Commit data baru
        id: commit
        run: |
          git config user.name  "idx-insight-bot"
          git config user.email "idx-insight-bot@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: perbarui keluaran pipeline $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (validasi tipe + build)
        working-directory: web
        run: |
          npm ci
          npm run build

      # Deploy dilakukan Cloudflare Workers Builds dari commit ini (web/wrangler.toml → ./dist).
      # Tidak perlu token/secrets di repo; lihat README bagian Hosting.
