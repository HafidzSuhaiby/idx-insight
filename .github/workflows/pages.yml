name: Deploy ke GitHub Pages

# Alternatif dari Cloudflare Pages. Aktifkan: Settings → Pages → Source: GitHub Actions.
# Situs akan di https://<user>.github.io/<repo>/ — base path diisi otomatis dari nama repo.

on:
  workflow_dispatch:

# Hanya manual: jalur utama adalah Cloudflare Worker (daily.yml).
# Aktifkan lewat Settings → Pages → Source: GitHub Actions bila ingin memakai jalur ini.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dengan base path repo
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4